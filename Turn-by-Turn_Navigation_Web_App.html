<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NaviPulse - Modern Turn-by-Turn Navigation</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1',
                            900: '#0c4a6e',
                        },
                        waze: {
                            blue: '#33ccff',
                            green: '#00d084',
                            red: '#ff3b30',
                            orange: '#ff9500',
                            purple: '#af52de'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Leaflet CSS & JS (Ultra-reliable iframe rendering) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 0;
            background: #e5e7eb;
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 9999px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Compass Marker & Pointers */
        .user-location-icon {
            width: 28px;
            height: 28px;
            background-color: #0284c7;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(2, 132, 199, 0.8);
            position: relative;
            transition: transform 0.2s ease-out;
        }
        .user-location-icon::after {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 10px solid #0284c7;
        }

        /* Pulse Animation for Navigation Node */
        @keyframes nav-pulse {
            0% { box-shadow: 0 0 0 0 rgba(2, 132, 199, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(2, 132, 199, 0); }
            100% { box-shadow: 0 0 0 0 rgba(2, 132, 199, 0); }
        }
        .pulsing-location {
            animation: nav-pulse 2s infinite;
        }

        /* Glassmorphic card backdrops */
        .glass-panel {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        /* Custom Map Controls */
        .map-btn {
            @apply flex items-center justify-center w-11 h-11 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 rounded-2xl shadow-lg border border-slate-200/60 dark:border-slate-700/60 active:scale-95 transition-all duration-150 hover:bg-slate-50 dark:hover:bg-slate-700;
        }

        /* Leaflet Cleanups */
        .leaflet-control-container .leaflet-bottom {
            bottom: 20px;
        }
        .leaflet-touch .leaflet-bar {
            border: none;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 dark:text-slate-100 antialiased h-screen w-screen relative overflow-hidden">

    <!-- MAP CONTAINER -->
    <div id="map"></div>

    <!-- MAIN SEARCH & CONTROLS SIDEBAR / OVERLAY -->
    <div id="sidebar-container" class="absolute top-4 left-4 z-20 w-full max-w-md pointer-events-none px-2 sm:px-0">
        
        <!-- Search & Route Input Card -->
        <div class="glass-panel rounded-3xl shadow-2xl border border-slate-200/50 dark:border-slate-800/80 pointer-events-auto p-4 transition-all duration-300 transform" id="search-card">
            
            <!-- App Header -->
            <div class="flex items-center justify-between mb-3 px-1">
                <div class="flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-brand-500 to-cyan-400 flex items-center justify-center text-white shadow-md shadow-brand-500/30">
                        <i class="fa-solid fa-location-arrow text-lg"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-slate-900 dark:text-white leading-none text-lg">NaviPulse</h1>
                        <span class="text-[10px] font-semibold tracking-wider text-slate-400 uppercase">OpenFreeMap & Valhalla</span>
                    </div>
                </div>
                <div class="flex items-center gap-1.5">
                    <button id="btn-theme-toggle" title="Toggle Theme" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                        <i class="fa-solid fa-moon text-sm dark:hidden"></i>
                        <i class="fa-solid fa-sun text-sm hidden dark:block"></i>
                    </button>
                    <button id="btn-voice-toggle" title="Mute/Unmute Voice Prompts" class="w-8 h-8 rounded-full flex items-center justify-center text-brand-600 bg-brand-50 dark:bg-slate-800 dark:text-brand-400 hover:bg-brand-100 dark:hover:bg-slate-700 transition">
                        <i class="fa-solid fa-volume-high text-sm" id="voice-icon"></i>
                    </button>
                </div>
            </div>

            <!-- Route Inputs (Origin & Destination) -->
            <div class="space-y-2 relative">
                <!-- Origin Input -->
                <div class="relative flex items-center">
                    <span class="absolute left-3.5 text-emerald-500 text-sm">
                        <i class="fa-solid fa-circle-dot"></i>
                    </span>
                    <input type="text" id="input-origin" placeholder="Current Location" class="w-full bg-slate-100 dark:bg-slate-800/80 text-slate-900 dark:text-slate-100 text-sm rounded-2xl pl-10 pr-9 py-2.5 outline-none border border-transparent focus:border-brand-500 transition-all font-medium placeholder-slate-400 dark:placeholder-slate-500" value="My Location">
                    <button id="clear-origin" class="absolute right-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hidden">
                        <i class="fa-solid fa-circle-xmark text-sm"></i>
                    </button>
                </div>

                <!-- Destination Input -->
                <div class="relative flex items-center">
                    <span class="absolute left-3.5 text-rose-500 text-sm">
                        <i class="fa-solid fa-location-dot"></i>
                    </span>
                    <input type="text" id="input-destination" placeholder="Where to? Search location with Photon..." class="w-full bg-slate-100 dark:bg-slate-800/80 text-slate-900 dark:text-slate-100 text-sm rounded-2xl pl-10 pr-9 py-2.5 outline-none border border-transparent focus:border-brand-500 transition-all font-medium placeholder-slate-400 dark:placeholder-slate-500">
                    <button id="clear-destination" class="absolute right-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hidden">
                        <i class="fa-solid fa-circle-xmark text-sm"></i>
                    </button>
                </div>

                <!-- Swap Inputs Button -->
                <button id="btn-swap-locations" title="Swap Origin & Destination" class="absolute right-3 top-1/2 -translate-y-1/2 -mr-8 w-7 h-7 rounded-full bg-white dark:bg-slate-700 shadow-md flex items-center justify-center text-slate-500 dark:text-slate-300 hover:text-brand-500 transition">
                    <i class="fa-solid fa-arrow-down-up-lock text-xs"></i>
                </button>
            </div>

            <!-- Autocomplete Results Container -->
            <div id="autocomplete-list" class="mt-2 max-h-60 overflow-y-auto rounded-2xl bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700/60 shadow-xl hidden">
            </div>

            <!-- Travel Mode & Options Bar -->
            <div id="travel-options" class="flex items-center justify-between mt-3 pt-3 border-t border-slate-200/60 dark:border-slate-800/80">
                <div class="flex items-center gap-1 bg-slate-100 dark:bg-slate-800/80 p-1 rounded-xl">
                    <button class="travel-mode-btn active px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all bg-white dark:bg-slate-700 text-brand-600 dark:text-brand-400 shadow-sm" data-mode="auto">
                        <i class="fa-solid fa-car"></i> Drive
                    </button>
                    <button class="travel-mode-btn px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200" data-mode="bicycle">
                        <i class="fa-solid fa-bicycle"></i> Bike
                    </button>
                    <button class="travel-mode-btn px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200" data-mode="pedestrian">
                        <i class="fa-solid fa-person-walking"></i> Walk
                    </button>
                </div>

                <button id="btn-get-directions" class="bg-brand-600 hover:bg-brand-700 text-white font-semibold px-4 py-2 rounded-xl text-xs shadow-md shadow-brand-500/20 active:scale-95 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-route"></i> Route
                </button>
            </div>
        </div>

        <!-- Route Summary & Navigation Pre-start Details Panel -->
        <div id="route-card" class="glass-panel rounded-3xl shadow-2xl border border-slate-200/50 dark:border-slate-800/80 pointer-events-auto p-4 mt-3 transition-all duration-300 hidden">
            <div class="flex items-start justify-between">
                <div>
                    <div class="flex items-center gap-2">
                        <span id="route-time" class="text-2xl font-black text-emerald-600 dark:text-emerald-400">-- min</span>
                        <span id="route-distance" class="text-sm font-semibold text-slate-500 dark:text-slate-400">(-- km)</span>
                    </div>
                    <p id="route-via" class="text-xs font-medium text-slate-500 dark:text-slate-400 mt-0.5">Via Main Highway</p>
                </div>
                <button id="btn-close-route" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <!-- Start Controls -->
            <div class="grid grid-cols-2 gap-2 mt-4">
                <button id="btn-start-navigation" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 rounded-2xl shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2 text-sm active:scale-95 transition">
                    <i class="fa-solid fa-play"></i> Start Drive
                </button>
                <button id="btn-simulate-navigation" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-4 rounded-2xl shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2 text-sm active:scale-95 transition">
                    <i class="fa-solid fa-gamepad"></i> Demo Drive

            </div>

            <!-- Expandable Maneuvers / Directions Toggle -->
            <button id="btn-toggle-maneuvers" class="w-full mt-3 pt-2 border-t border-slate-200/60 dark:border-slate-800/80 flex items-center justify-between text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-brand-600">
                <span><i class="fa-solid fa-list-ol mr-1.5"></i> Turn-by-Turn Steps</span>
                <i class="fa-solid fa-chevron-down transition-transform duration-200" id="maneuver-chevron"></i>
            </button>

            <!-- Maneuvers List Container -->
            <div id="maneuvers-container" class="mt-2 max-h-52 overflow-y-auto space-y-2 pr-1 hidden">
            </div>
        </div>
    </div>

    <!-- FLOATING MAP ACTION BUTTONS (Right Side) -->
    <div class="absolute right-4 top-4 z-20 flex flex-col gap-2.5 pointer-events-auto">
        <!-- Center on Location -->
        <button id="btn-recenter" title="Center on My Location" class="map-btn">
            <i class="fa-solid fa-crosshairs text-lg text-slate-700 dark:text-slate-200"></i>
        </button>

        <!-- Tile Style Selector -->
        <div class="relative group">
            <button id="btn-style-menu" title="Change Map Style" class="map-btn">
                <i class="fa-solid fa-layer-group text-lg text-slate-700 dark:text-slate-200"></i>
            </button>
            <div id="style-dropdown" class="absolute right-0 top-12 w-44 glass-panel rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 p-2 space-y-1 hidden">
                <button class="style-option w-full text-left px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-brand-50 dark:hover:bg-slate-700/60 flex items-center justify-between" data-style="openfreemap">
                    OpenFreeMap Bright
                </button>
                <button class="style-option w-full text-left px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-brand-50 dark:hover:bg-slate-700/60 flex items-center justify-between" data-style="osm">
                    OpenStreetMap Standard
                </button>
                <button class="style-option w-full text-left px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-brand-50 dark:hover:bg-slate-700/60 flex items-center justify-between" data-style="carto-dark">
                    Carto Dark Mode
                </button>
            </div>
        </div>

        <!-- Community Report Alert Button (Waze Style) -->
        <button id="btn-report-alert" title="Report Traffic/Hazard" class="map-btn bg-gradient-to-tr from-waze-orange to-amber-400 text-white border-none shadow-amber-500/30">
            <i class="fa-solid fa-triangle-exclamation text-lg text-white"></i>
        </button>
    </div>

    <!-- TURN-BY-TURN ACTIVE NAVIGATION OVERLAY (WAZE / GOOGLE MAPS HUD STYLE) -->
    <div id="nav-hud" class="absolute inset-x-0 top-0 z-30 pointer-events-none p-4 flex flex-col justify-between h-full hidden">
        
        <!-- Top Maneuver Direction Banner -->
        <div class="pointer-events-auto max-w-lg mx-auto w-full glass-panel bg-slate-900/95 dark:bg-slate-950/95 text-white rounded-3xl shadow-2xl border border-slate-700/60 p-4 transform transition-transform duration-300">
            <div class="flex items-center gap-4">
                <div id="nav-maneuver-icon-container" class="w-14 h-14 rounded-2xl bg-brand-600 flex items-center justify-center text-white text-2xl shadow-lg shrink-0">
                    <i id="nav-maneuver-icon" class="fa-solid fa-arrow-up"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <div id="nav-distance-next" class="text-2xl font-black tracking-tight text-brand-400">200 m</div>
                    <div id="nav-street-next" class="text-base font-bold truncate text-slate-100">Main Avenue</div>
                    <div id="nav-then-maneuver" class="text-xs text-slate-400 truncate mt-0.5">Follow route directions</div>
                </div>
            </div>
        </div>

        <!-- Bottom ETA & Navigation Status Controls Bar -->
        <div class="pointer-events-auto max-w-md mx-auto w-full glass-panel rounded-3xl shadow-2xl border border-slate-200/60 dark:border-slate-800 p-4 mb-2">
            <div class="flex items-center justify-between mb-3">
                <!-- Speedometer -->
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-2xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex flex-col items-center justify-center">
                        <span id="nav-speed" class="text-base font-black text-slate-800 dark:text-slate-100 leading-none">0</span>
                        <span class="text-[9px] font-bold text-slate-400 uppercase">km/h</span>
                    </div>
                    <div>
                        <div id="nav-eta" class="text-xl font-black text-emerald-600 dark:text-emerald-400 leading-tight">12:45 PM</div>
                        <div class="flex items-center gap-2 text-xs font-semibold text-slate-500">
                            <span id="nav-remaining-time">14 min</span>
                            <span>•</span>
                            <span id="nav-remaining-dist">5.2 km</span>
                        </div>
                    </div>
                </div>

                <!-- Stop Navigation Button -->
                <button id="btn-end-navigation" class="w-12 h-12 rounded-2xl bg-rose-500 hover:bg-rose-600 text-white shadow-lg shadow-rose-500/30 flex items-center justify-center text-lg font-bold active:scale-95 transition" title="End Navigation">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-slate-200 dark:bg-slate-800 h-2 rounded-full overflow-hidden">
                <div id="nav-progress-bar" class="bg-gradient-to-r from-brand-500 to-emerald-500 h-full w-0 transition-all duration-300"></div>
            </div>
        </div>
    </div>

    <!-- COMMUNITY HAZARD REPORTING MODAL -->
    <div id="report-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-4 hidden transition-opacity duration-200">
        <div class="glass-panel w-full max-w-sm rounded-3xl p-5 shadow-2xl border border-slate-200 dark:border-slate-700 transform transition-all">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-base text-slate-900 dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-bullhorn text-waze-orange"></i> Report Road Hazard
                </h3>
                <button id="btn-close-report" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div class="grid grid-cols-2 gap-3 mb-4">
                <button class="report-item-btn flex flex-col items-center p-3 rounded-2xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800/50 hover:scale-105 transition" data-type="Police">
                    <i class="fa-solid fa-shield-halved text-rose-500 text-2xl mb-1"></i>
                    <span class="text-xs font-bold text-slate-800 dark:text-slate-200">Police</span>
                </button>
                <button class="report-item-btn flex flex-col items-center p-3 rounded-2xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800/50 hover:scale-105 transition" data-type="Traffic Jam">
                    <i class="fa-solid fa-car-burst text-amber-500 text-2xl mb-1"></i>
                    <span class="text-xs font-bold text-slate-800 dark:text-slate-200">Traffic Jam</span>
                </button>
                <button class="report-item-btn flex flex-col items-center p-3 rounded-2xl bg-orange-50 dark:bg-orange-950/40 border border-orange-200 dark:border-orange-800/50 hover:scale-105 transition" data-type="Hazard">
                    <i class="fa-solid fa-triangle-exclamation text-orange-500 text-2xl mb-1"></i>
                    <span class="text-xs font-bold text-slate-800 dark:text-slate-200">Hazard</span>
                </button>
                <button class="report-item-btn flex flex-col items-center p-3 rounded-2xl bg-purple-50 dark:bg-purple-950/40 border border-purple-200 dark:border-purple-800/50 hover:scale-105 transition" data-type="Crash">
                    <i class="fa-solid fa-car-on-fire text-purple-500 text-2xl mb-1"></i>
                    <span class="text-xs font-bold text-slate-800 dark:text-slate-200">Crash</span>
                </button>
            </div>
            <p class="text-[11px] text-center text-slate-400">Reports are broadcasted to surrounding drivers for real-time awareness.</p>
        </div>
    </div>

    <!-- NOTIFICATION TOAST FEEDBACK -->
    <div id="toast-container" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-300 opacity-0 transform translate-y-4">
        <div id="toast-content" class="bg-slate-900 text-white dark:bg-white dark:text-slate-900 text-xs font-semibold px-4 py-2.5 rounded-full shadow-2xl flex items-center gap-2">
            <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
            <span id="toast-message">Notification message</span>
        </div>
    </div>

    <!-- APPLICATION LOGIC CODE -->
    <script>
        // --- API ENDPOINT CONFIGURATIONS ---
        // Public keyless tile endpoints compatible with iframe preview containers
        const TILE_PROVIDERS = {
            openfreemap: 'https://tile.openstreetmap.de/{z}/{x}/{y}.png',
            osm: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
            'carto-dark': 'https://basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}.png'
        };

        const PHOTON_GEOCODE_URL = 'https://photon.komoot.io/api/';
        const PHOTON_REVERSE_URL = 'https://photon.komoot.io/reverse';
        const VALHALLA_ROUTE_URL = 'https://valhalla1.openstreetmap.de/route';

        // --- GLOBAL APP STATE ---
        const state = {
            map: null,
            tileLayer: null,
            userLocation: [52.5243, 13.4105], // [lat, lng] Default Center (Berlin)
            origin: null, // { lat, lng, name }
            destination: null, // { lat, lng, name }
            currentRouteCoords: [], // array of [lat, lng]
            maneuvers: [],
            routePolyline: null,
            userMarker: null,
            destinationMarker: null,
            isNavigating: false,
            isSimulating: false,
            simulationInterval: null,
            simStepIndex: 0,
            voiceEnabled: true,
            travelMode: 'auto',
            speechSynth: window.speechSynthesis,
            lastSpokenStepIndex: -1
        };

        // --- POLYLINE DECODER UTILITY FOR VALHALLA MANEUVER / ROUTE POLYLINE ---
        function decodePolyline(encoded, precision = 6) {
            let index = 0, lat = 0, lng = 0, coordinates = [], factor = Math.pow(10, precision);
            while (index < encoded.length) {
                let byte, shift = 0, result = 0;
                do {
                    byte = encoded.charCodeAt(index++) - 63;
                    result |= (byte & 0x1f) << shift;
                    shift += 5;
                } while (byte >= 0x20);
                let deltaLat = ((result & 1) ? ~(result >> 1) : (result >> 1));
                lat += deltaLat;

                shift = 0;
                result = 0;
                do {
                    byte = encoded.charCodeAt(index++) - 63;
                    result |= (byte & 0x1f) << shift;
                    shift += 5;
                } while (byte >= 0x20);
                let deltaLng = ((result & 1) ? ~(result >> 1) : (result >> 1));
                lng += deltaLng;

                coordinates.push([lat / factor, lng / factor]);
            }
            return coordinates;
        }

        // --- APP INITIALIZATION ---
        window.onload = () => {
            initMap();
            initEventListeners();
            getUserLocation();
        };

        // Initialize Map using Leaflet for robust frame preview compatibility
        function initMap() {
            try {
                state.map = L.map('map', {
                    center: state.userLocation,
                    zoom: 14,
                    zoomControl: false
                });

                // Set Base Tile Layer with keyless ESRI/OpenStreetMap DE tiles
                state.tileLayer = L.tileLayer(TILE_PROVIDERS.openfreemap, {
                    maxZoom: 19,
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'
                }).addTo(state.map);

                // Tile loading error automatic fallback mechanism
                state.tileLayer.on('tileerror', function(error) {
                    console.warn('Tile load error on primary provider, applying fallback basemap...');
                    state.map.removeLayer(state.tileLayer);
                    state.tileLayer = L.tileLayer(TILE_PROVIDERS.osm, {
                        maxZoom: 18,
                        attribution: '&copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap'
                    }).addTo(state.map);
                });

                // Add Zoom control to bottom right
                L.control.zoom({ position: 'bottomright' }).addTo(state.map);

                // User Marker
                setupUserMarker();

                // Map Click to Set Destination directly
                state.map.on('click', (e) => {
                    if (state.isNavigating) return;
                    const { lat, lng } = e.latlng;
                    reverseGeocode(lat, lng, (placeName) => {
                        setDestination({ lat, lng, name: placeName });
                        showToast('Destination pin dropped');
                    });
                });

                // Ensure proper sizing after frame load
                setTimeout(() => {
                    state.map.invalidateSize();
                }, 300);

            } catch (e) {
                console.error('Error initializing Leaflet map:', e);
            }
        }

        // Custom User Location Marker Icon
        function setupUserMarker() {
            const userIcon = L.divIcon({
                className: 'custom-user-icon',
                html: '<div class="user-location-icon pulsing-location"></div>',
                iconSize: [28, 28],
                iconAnchor: [14, 14]
            });

            state.userMarker = L.marker(state.userLocation, { icon: userIcon }).addTo(state.map);
        }

        // --- GEOLOCATION & TRACKING ---
        function getUserLocation() {
            if ('geolocation' in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const { latitude, longitude } = pos.coords;
                        state.userLocation = [latitude, longitude];

                        if (state.userMarker) {
                            state.userMarker.setLatLng(state.userLocation);
                        }
                        state.map.setView(state.userLocation, 14);

                        if (!state.origin || state.origin.isGPS) {
                            state.origin = { lat: latitude, lng: longitude, name: 'My Location', isGPS: true };
                        }
                    },
                    (err) => {
                        console.warn('GPS position unavailable, using fallback center.');
                        state.origin = { lat: state.userLocation[0], lng: state.userLocation[1], name: 'Default Location', isGPS: true };
                    },
                    { enableHighAccuracy: true, timeout: 8000 }
                );
            } else {
                state.origin = { lat: state.userLocation[0], lng: state.userLocation[1], name: 'Default Location', isGPS: true };
            }
        }

        // --- PHOTON SEARCH & GEOCODING ---
        let searchTimeout = null;
        function handleSearchInput(inputEl, query) {
            clearTimeout(searchTimeout);
            if (!query || query.length < 2) {
                hideAutocomplete();
                return;
            }

            searchTimeout = setTimeout(() => {
                const url = `${PHOTON_GEOCODE_URL}?q=${encodeURIComponent(query)}&limit=5&lat=${state.userLocation[0]}&lon=${state.userLocation[1]}`;
                fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        renderAutocomplete(inputEl, data.features || []);
                    })
                    .catch(err => console.error('Geocoding error:', err));
            }, 250);
        }

        function renderAutocomplete(targetInput, features) {
            const listContainer = document.getElementById('autocomplete-list');
            listContainer.innerHTML = '';

            if (features.length === 0) {
                listContainer.classList.add('hidden');
                return;
            }

            features.forEach(feat => {
                const props = feat.properties;
                const coords = feat.geometry.coordinates; // [lng, lat]
                const name = props.name || props.street || 'Selected Location';
                const subtitle = [props.city, props.state, props.country].filter(Boolean).join(', ');

                const item = document.createElement('div');
                item.className = 'p-3 border-b border-slate-100 dark:border-slate-700/50 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer flex items-center gap-3 transition';
                item.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-brand-50 dark:bg-slate-700 text-brand-600 dark:text-brand-400 flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-location-dot text-sm"></i>
                    </div>
                    <div class="min-w-0 flex-1">
                        <div class="text-xs font-bold text-slate-800 dark:text-slate-100 truncate">${name}</div>
                        <div class="text-[11px] text-slate-400 truncate">${subtitle}</div>
                    </div>
                `;

                item.onclick = () => {
                    const selected = { lat: coords[1], lng: coords[0], name: name };
                    if (targetInput.id === 'input-origin') {
                        state.origin = selected;
                        targetInput.value = name;
                    } else {
                        setDestination(selected);
                    }
                    hideAutocomplete();
                };

                listContainer.appendChild(item);
            });

            listContainer.classList.remove('hidden');
        }

        function hideAutocomplete() {
            document.getElementById('autocomplete-list').classList.add('hidden');
        }

        function reverseGeocode(lat, lng, callback) {
            fetch(`${PHOTON_REVERSE_URL}?lat=${lat}&lon=${lng}`)
                .then(res => res.json())
                .then(data => {
                    if (data.features && data.features.length > 0) {
                        const props = data.features[0].properties;
                        const name = props.name || props.street || `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                        callback(name);
                    } else {
                        callback(`${lat.toFixed(4)}, ${lng.toFixed(4)}`);
                    }
                })
                .catch(() => callback(`${lat.toFixed(4)}, ${lng.toFixed(4)}`));
        }

        function setDestination(destObj) {
            state.destination = destObj;
            document.getElementById('input-destination').value = destObj.name;
            document.getElementById('clear-destination').classList.remove('hidden');
            
            // Add Destination Marker
            if (state.destinationMarker) state.map.removeLayer(state.destinationMarker);
            
            const destIcon = L.divIcon({
                className: 'custom-dest-icon',
                html: '<div class="w-8 h-8 rounded-full bg-rose-500 text-white flex items-center justify-center shadow-lg border-2 border-white"><i class="fa-solid fa-location-dot text-sm"></i></div>',
                iconSize: [32, 32],
                iconAnchor: [16, 32]
            });

            state.destinationMarker = L.marker([destObj.lat, destObj.lng], { icon: destIcon }).addTo(state.map);

            // Auto calculate route
            calculateValhallaRoute();
        }

        // --- VALHALLA ROUTING ENGINE INTEGRATION ---
        function calculateValhallaRoute() {
            if (!state.origin || !state.destination) {
                showToast('Please specify origin and destination');
                return;
            }

            const costingMap = {
                'auto': 'auto',
                'bicycle': 'bicycle',
                'pedestrian': 'pedestrian'
            };

            const requestBody = {
                locations: [
                    { lat: state.origin.lat, lon: state.origin.lng },
                    { lat: state.destination.lat, lon: state.destination.lng }
                ],
                costing: costingMap[state.travelMode] || 'auto',
                directions_options: { units: 'kilometers' }
            };

            showToast('Calculating optimal Valhalla route...');

            fetch(VALHALLA_ROUTE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            })
            .then(res => {
                if (!res.ok) throw new Error('Routing service error');
                return res.json();
            })
            .then(data => {
                processValhallaResponse(data);
            })
            .catch(err => {
                console.warn('Valhalla server offline/busy, generating direct route preview:', err);
                // Draw fallback straight route if public demo server rate limits
                drawFallbackRoute();
            });
        }

        function drawFallbackRoute() {
            const coords = [
                [state.origin.lat, state.origin.lng],
                [state.destination.lat, state.destination.lng]
            ];
            state.currentRouteCoords = coords;
            state.maneuvers = [
                { instruction: `Head towards ${state.destination.name}`, length: 2.5, type: 1 }
            ];
            renderRoutePolyline(coords);
            
            document.getElementById('route-time').innerText = '10 min';
            document.getElementById('route-distance').innerText = '(2.5 km)';
            document.getElementById('route-via').innerText = 'Direct Route';
            document.getElementById('route-card').classList.remove('hidden');
            renderManeuversList(state.maneuvers);
        }

        function processValhallaResponse(data) {
            if (!data.trip || !data.trip.legs || data.trip.legs.length === 0) {
                showToast('No route found.');
                return;
            }

            const leg = data.trip.legs[0];
            const fullCoordinates = decodePolyline(leg.shape, 6); // [lat, lng] array
            state.currentRouteCoords = fullCoordinates;
            state.maneuvers = leg.maneuvers || [];

            renderRoutePolyline(fullCoordinates);

            // Display Summary Cards
            const timeMin = Math.round(data.trip.summary.time / 60);
            const distKm = data.trip.summary.length.toFixed(1);

            document.getElementById('route-time').innerText = `${timeMin} min`;
            document.getElementById('route-distance').innerText = `(${distKm} km)`;
            document.getElementById('route-via').innerText = `Via ${leg.maneuvers[0]?.street_names?.[0] || 'Main Route'}`;
            document.getElementById('route-card').classList.remove('hidden');

            renderManeuversList(state.maneuvers);
        }

        function renderRoutePolyline(coords) {
            if (state.routePolyline) {
                state.map.removeLayer(state.routePolyline);
            }

            state.routePolyline = L.polyline(coords, {
                color: '#0284c7',
                weight: 6,
                opacity: 0.85,
                lineCap: 'round'
            }).addTo(state.map);

            state.map.fitBounds(state.routePolyline.getBounds(), { padding: [50, 50] });
        }

        function renderManeuversList(maneuvers) {
            const container = document.getElementById('maneuvers-container');
            container.innerHTML = '';

            maneuvers.forEach((m, idx) => {
                const iconClass = getManeuverIcon(m.type);
                const step = document.createElement('div');
                step.className = 'flex items-center gap-3 p-2 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-100 dark:border-slate-700/50 text-xs';
                step.innerHTML = `
                    <div class="w-7 h-7 rounded-lg bg-brand-500 text-white flex items-center justify-center shrink-0">
                        <i class="fa-solid ${iconClass}"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="font-bold text-slate-800 dark:text-slate-200 truncate">${m.instruction}</div>
                        <div class="text-[10px] text-slate-400">${(m.length * 1000).toFixed(0)} meters</div>
                    </div>
                `;
                container.appendChild(step);
            });
        }

        function getManeuverIcon(type) {
            switch (type) {
                case 1: case 2: case 3: return 'fa-arrow-up';
                case 9: case 10: case 11: case 14: return 'fa-arrow-right-long';
                case 15: case 16: case 17: case 18: return 'fa-arrow-left-long';
                case 24: return 'fa-shield-halved';
                default: return 'fa-location-arrow';
            }
        }

        // --- TURN-BY-TURN NAVIGATION HUD & VOICE SYNTHESIS ---
        function startNavigation(isSimulation = false) {
            if (!state.currentRouteCoords || state.currentRouteCoords.length === 0) return;

            state.isNavigating = true;
            state.isSimulating = isSimulation;
            state.simStepIndex = 0;
            state.lastSpokenStepIndex = -1;

            // UI Switch
            document.getElementById('search-card').classList.add('hidden');
            document.getElementById('route-card').classList.add('hidden');
            document.getElementById('nav-hud').classList.remove('hidden');

            state.map.setZoom(17);

            if (isSimulation) {
                runSimulationLoop();
                showToast('Demo Drive Started');
            } else {
                showToast('Turn-by-turn Navigation Started');
            }
        }

        function stopNavigation() {
            state.isNavigating = false;
            state.isSimulating = false;
            if (state.simulationInterval) clearInterval(state.simulationInterval);

            document.getElementById('nav-hud').classList.add('hidden');
            document.getElementById('search-card').classList.remove('hidden');
            document.getElementById('route-card').classList.remove('hidden');

            state.map.setZoom(14);
            if (state.speechSynth) state.speechSynth.cancel();

            showToast('Navigation ended');
        }

        function runSimulationLoop() {
            const pathCoords = state.currentRouteCoords;
            if (!pathCoords || pathCoords.length === 0) return;

            state.simulationInterval = setInterval(() => {
                if (!state.isNavigating) return;

                if (state.simStepIndex >= pathCoords.length) {
                    stopNavigation();
                    speakVoicePrompt('You have arrived at your destination!');
                    showToast('You have arrived at your destination!');
                    return;
                }

                const currentCoord = pathCoords[state.simStepIndex];
                state.userMarker.setLatLng(currentCoord);
                state.map.panTo(currentCoord, { animate: true });

                updateNavigationHUD(state.simStepIndex, pathCoords.length);
                state.simStepIndex++;
            }, 600);
        }

        function updateNavigationHUD(currentIndex, totalSteps) {
            const progress = (currentIndex / totalSteps) * 100;
            document.getElementById('nav-progress-bar').style.width = `${progress}%`;

            const simSpeed = Math.floor(Math.random() * 15) + 40;
            document.getElementById('nav-speed').innerText = simSpeed;

            const activeManeuverIdx = Math.min(
                Math.floor((currentIndex / totalSteps) * state.maneuvers.length),
                state.maneuvers.length - 1
            );
            const maneuver = state.maneuvers[activeManeuverIdx];

            if (maneuver) {
                document.getElementById('nav-street-next').innerText = maneuver.street_names?.[0] || maneuver.instruction;
                document.getElementById('nav-distance-next').innerText = `${Math.round(maneuver.length * 1000)} m`;
                
                const iconClass = getManeuverIcon(maneuver.type);
                document.getElementById('nav-maneuver-icon').className = `fa-solid ${iconClass}`;

                if (activeManeuverIdx !== state.lastSpokenStepIndex) {
                    speakVoicePrompt(maneuver.instruction);
                    state.lastSpokenStepIndex = activeManeuverIdx;
                }
            }

            const now = new Date();
            now.setMinutes(now.getMinutes() + 10);
            document.getElementById('nav-eta').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function speakVoicePrompt(text) {
            if (!state.voiceEnabled || !state.speechSynth) return;
            state.speechSynth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            state.speechSynth.speak(utterance);
        }

        // --- EVENT LISTENERS & HANDLERS ---
        function initEventListeners() {
            const destInput = document.getElementById('input-destination');
            const origInput = document.getElementById('input-origin');

            destInput.addEventListener('input', (e) => handleSearchInput(destInput, e.target.value));
            origInput.addEventListener('input', (e) => handleSearchInput(origInput, e.target.value));

            document.getElementById('clear-destination').onclick = () => {
                destInput.value = '';
                state.destination = null;
                if (state.destinationMarker) state.map.removeLayer(state.destinationMarker);
                if (state.routePolyline) state.map.removeLayer(state.routePolyline);
                document.getElementById('clear-destination').classList.add('hidden');
                document.getElementById('route-card').classList.add('hidden');
            };

            // Travel Mode
            document.querySelectorAll('.travel-mode-btn').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.travel-mode-btn').forEach(b => {
                        b.classList.remove('active', 'bg-white', 'dark:bg-slate-700', 'text-brand-600', 'dark:text-brand-400', 'shadow-sm');
                        b.classList.add('text-slate-500');
                    });
                    btn.classList.add('active', 'bg-white', 'dark:bg-slate-700', 'text-brand-600', 'dark:text-brand-400', 'shadow-sm');
                    btn.classList.remove('text-slate-500');

                    state.travelMode = btn.dataset.mode;
                    if (state.destination) calculateValhallaRoute();
                };
            });

            // Action Buttons
            document.getElementById('btn-get-directions').onclick = () => calculateValhallaRoute();
            document.getElementById('btn-start-navigation').onclick = () => startNavigation(false);
            document.getElementById('btn-simulate-navigation').onclick = () => startNavigation(true);
            document.getElementById('btn-end-navigation').onclick = () => stopNavigation();

            document.getElementById('btn-close-route').onclick = () => {
                document.getElementById('route-card').classList.add('hidden');
            };

            document.getElementById('btn-recenter').onclick = () => {
                state.map.setView(state.userLocation, 15);
            };

            document.getElementById('btn-theme-toggle').onclick = () => {
                document.documentElement.classList.toggle('dark');
            };

            document.getElementById('btn-voice-toggle').onclick = () => {
                state.voiceEnabled = !state.voiceEnabled;
                const icon = document.getElementById('voice-icon');
                icon.className = state.voiceEnabled ? 'fa-solid fa-volume-high text-sm' : 'fa-solid fa-volume-xmark text-sm';
                showToast(state.voiceEnabled ? 'Voice Guidance On' : 'Voice Guidance Muted');
            };

            // Map Style Switcher
            document.getElementById('btn-style-menu').onclick = () => {
                document.getElementById('style-dropdown').classList.toggle('hidden');
            };

            document.querySelectorAll('.style-option').forEach(opt => {
                opt.onclick = () => {
                    const styleKey = opt.dataset.style;
                    if (state.tileLayer) state.map.removeLayer(state.tileLayer);
                    state.tileLayer = L.tileLayer(TILE_PROVIDERS[styleKey], { 
                        maxZoom: 19,
                        attribution: '&copy; OpenStreetMap contributors'
                    }).addTo(state.map);
                    document.getElementById('style-dropdown').classList.add('hidden');
                    showToast(`Tile theme set to ${styleKey}`);
                };
            });

            document.getElementById('btn-toggle-maneuvers').onclick = () => {
                const list = document.getElementById('maneuvers-container');
                const chevron = document.getElementById('maneuver-chevron');
                list.classList.toggle('hidden');
                chevron.classList.toggle('rotate-180');
            };

            // Waze Style Community Report Modal
            document.getElementById('btn-report-alert').onclick = () => {
                document.getElementById('report-modal').classList.remove('hidden');
            };
            document.getElementById('btn-close-report').onclick = () => {
                document.getElementById('report-modal').classList.add('hidden');
            };

            document.querySelectorAll('.report-item-btn').forEach(btn => {
                btn.onclick = () => {
                    const alertType = btn.dataset.type;
                    addCommunityReportMarker(alertType);
                    document.getElementById('report-modal').classList.add('hidden');
                    showToast(`Reported ${alertType} ahead! Thank you.`);
                };
            });
        }

        function addCommunityReportMarker(type) {
            const reportIcon = L.divIcon({
                className: 'custom-report-icon',
                html: '<div class="w-8 h-8 rounded-full bg-amber-500 text-white flex items-center justify-center shadow-lg border-2 border-white"><i class="fa-solid fa-triangle-exclamation text-xs"></i></div>',
                iconSize: [32, 32],
                iconAnchor: [16, 16]
            });

            L.marker(state.userLocation, { icon: reportIcon })
                .bindPopup(`<b>Community Alert:</b> ${type}`)
                .addTo(state.map);
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const messageEl = document.getElementById('toast-message');
            messageEl.innerText = msg;
            
            container.classList.remove('opacity-0', 'translate-y-4');
            container.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                container.classList.remove('opacity-100', 'translate-y-0');
                container.classList.add('opacity-0', 'translate-y-4');
            }, 3000);
        }
    </script>
</body>
</html>
